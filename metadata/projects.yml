  - id: waterscript
    categories:
      - data
      - ai
    technologies:
      - Python
      - Snowflake
      - XGBoost
      - Geospatial
    featured: true
    highlight: true
    order: 3
    links:
      repository: https://github.com/matbdev/waterscript-ey-data-science-challenge
    media:
      type: concept
      variant: water-flow
      sources:
        - Landsat
        - TerraClimate
      label:
        en: Conceptual workflow
        pt-BR: Fluxo conceitual
    content:
      en:
        title: WaterScript
        subtitle: A broader picture of water quality.
        context: EY AI & Data Challenge · 2026
        badge: Data & machine learning project
        description: A multimodal pipeline combining water samples, Landsat imagery
          and climate data for water-quality modeling.
        problem: Predict water-quality parameters at locations outside the training
          regions.
        contribution: Built data ingestion and geospatial features with Python and
          Snowpark, then explored XGBoost/Optuna modeling with location-based GroupKFold
          validation.
        detailContext: Built for the EY AI & Data Challenge 2026, exploring geospatial
          data engineering and modeling.
        diagram:
          - Landsat + climate
          - Features
          - Model
      pt-BR:
        title: WaterScript
        subtitle: Uma visão mais ampla da qualidade da água.
        context: EY AI & Data Challenge · 2026
        badge: Projeto de dados e machine learning
        description: Pipeline multimodal que combina amostras de água, imagens Landsat
          e dados climáticos para modelar qualidade da água.
        problem: Prever parâmetros da qualidade da água em locais fora das regiões
          de treinamento.
        contribution: Construí a ingestão e os atributos geoespaciais com Python e
          Snowpark e explorei modelos XGBoost/Optuna com validação GroupKFold por
          localização.
        detailContext: Desenvolvido para o EY AI & Data Challenge 2026, explorando
          engenharia de dados geoespaciais e modelagem.
        diagram:
          - Landsat + clima
          - Atributos
          - Modelo
