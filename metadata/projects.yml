        badge: Campeão local · Global Nominee
        description: Um assistente com interface de voz que conecta qualidade do ar,
          clima e dados de satélite a decisões do dia a dia.
        problem: Tornar dados ambientais complexos mais acessíveis e fáceis de interpretar.
        contribution: Desenvolvi a aplicação de ponta a ponta e liderei a Tropa do
